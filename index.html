<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramadan Precision Clock 2026</title>
    <style>
        :root { --gold: #fbbf24; --navy: #0f172a; --slate: #1e293b; --emerald: #10b981; }
        body { background: var(--navy); color: white; font-family: 'Georgia', serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Islamic Geometric Pattern Background */
        .app-shell { width: 100%; max-width: 480px; background: var(--slate); border: 2px solid var(--gold); border-radius: 30px; padding: 25px; box-shadow: 0 0 40px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        
        /* Ad Placement */
        .ad-banner { width: 100%; height: 60px; background: rgba(255,255,255,0.05); margin-bottom: 15px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #475569; border: 1px dashed #334155; }

        .search-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background: #0f172a; border: 1px solid var(--gold); color: white; padding: 12px; border-radius: 15px; }
        
        .fiqh-badge { background: #334155; padding: 10px; border-radius: 15px; display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 14px; }
        .fiqh-badge select { background: transparent; color: var(--gold); border: none; font-weight: bold; cursor: pointer; }

        .main-timer { text-align: center; margin: 25px 0; }
        .clock-digits { font-size: 60px; font-weight: bold; color: var(--gold); font-family: 'Courier New', monospace; text-shadow: 0 0 15px rgba(251, 191, 36, 0.3); }
        .sync-indicator { font-size: 10px; color: var(--emerald); letter-spacing: 1px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #0f172a; padding: 20px; border-radius: 20px; border-bottom: 3px solid var(--gold); text-align: center; }
        .card-label { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .card-time { font-size: 24px; font-weight: bold; color: white; }

        .alarm-trigger { background: var(--gold); color: var(--navy); width: 100%; border: none; padding: 18px; border-radius: 15px; font-weight: bold; margin-top: 20px; cursor: pointer; font-size: 16px; box-shadow: 0 5px 15px rgba(251, 191, 36, 0.2); }
        .alarm-trigger.active { background: var(--emerald); color: white; }
    </style>
</head>
<body>

<div class="ad-banner">ADSENSE TOP BANNER PLACEHOLDER</div>

<div class="app-shell">
    <div class="search-area">
        <input type="text" id="cityInput" placeholder="Enter City (e.g. Karachi)">
        <button onclick="updateData()" style="background:var(--gold); border:none; border-radius:10px; padding:0 15px; cursor:pointer;">🔍</button>
    </div>

    <div class="fiqh-badge">
        <span>Sect / Fiqh:</span>
        <select id="fiqhMethod" onchange="updateData()">
            <option value="1">Hanafi (Sunni)</option>
            <option value="0">Jafari (Shia)</option>
        </select>
    </div>

    <div class="main-timer">
        <div class="sync-indicator">● LIVE ATOMIC SYNC</div>
        <div id="clock" class="clock-digits">00:00:00</div>
        <div id="currentLocation" style="color:#94a3b8; font-size:12px; margin-top:5px;">--</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-label">SEHRI ENDS</div>
            <div id="sehriTime" class="card-time">--:--</div>
        </div>
        <div class="card">
            <div class="card-label">IFTAR STARTS</div>
            <div id="iftarTime" class="card-time">--:--</div>
        </div>
    </div>

    <button id="alarmBtn" class="alarm-trigger" onclick="toggleAlarm()">ENABLE AZAN ALARM</button>
</div>

<div class="ad-banner" style="margin-top:20px;">ADSENSE BOTTOM BANNER PLACEHOLDER</div>

<audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script>
    let alarmOn = false;
    let timings = {};
    const audio = document.getElementById('beep');

    function toggleAlarm() {
        alarmOn = !alarmOn;
        const btn = document.getElementById('alarmBtn');
        btn.innerText = alarmOn ? "🔔 ALARM IS LIVE" : "ENABLE AZAN ALARM";
        btn.classList.toggle('active', alarmOn);
        audio.play().then(() => audio.pause()); // Unlock audio
    }

    async function updateData() {
        let city = document.getElementById('cityInput').value || "Karachi";
        const method = document.getElementById('fiqhMethod').value;
        
        document.getElementById('currentLocation').innerText = city.toUpperCase();

        try {
            // Fetching from AlAdhan with timestamp to bypass cache for accuracy
            const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${city}&country=&method=${method}&t=${Date.now()}`);
            const json = await res.json();
